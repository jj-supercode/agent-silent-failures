name: Wanted entry
description: A silent failure you have seen in practice but cannot reproduce or detect yet.
title: '[wanted] '
labels: ['wanted-entry']
body:
    - type: markdown
      attributes:
          value: |
              Use this when the failure is real but the reproduction or the detector is still missing. Describe what
              you saw; leave out anything that identifies your system or your users.
    - type: textarea
      id: observed
      attributes:
          label: What you observed
          description: The symptom, how it was found, and why nothing raised an error.
      validations:
          required: true
    - type: textarea
      id: signal
      attributes:
          label: Possible per-run signal
          description: What a single stored trace might show. Batch-only statistics do not fit a per-trace scorer.
    - type: textarea
      id: evidence
      attributes:
          label: Evidence that would promote it
          description: What reproduction, trace data or measurement would turn this into an entry.
    - type: checkboxes
      id: checks
      attributes:
          label: Checks
          options:
              - label: Nothing in this issue identifies a company, customer, product or person.
                required: true
