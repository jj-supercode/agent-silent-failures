# Publishes the package to npm when a GitHub Release is published. Authentication is npm trusted publishing (OIDC):
# no long-lived token is stored, and npm attaches a provenance attestation that links the tarball to this workflow run.
# No cache is restored in this job, so nothing written by another workflow can reach the published tarball.
name: release

on:
    release:
        types: [published]

permissions:
    contents: read
    id-token: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    publish:
        if: startsWith(github.event.release.tag_name, 'v')
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        env:
            # A Release marked as a pre-release goes to the `next` dist-tag, so `npm install` never picks it up.
            DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  registry-url: https://registry.npmjs.org

            # Trusted publishing needs npm 11.5.1 or later (https://docs.npmjs.com/trusted-publishers).
            - name: Install the pinned npm CLI
              run: npm install --global npm@12.2.0

            - name: The release tag names the package version
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: test "$TAG" = "v$(node -p "require('./package.json').version")"

            - run: pnpm install --frozen-lockfile
            - run: pnpm model:download
            - run: pnpm check

            # Built here, right before publishing, so the tarball never depends on what an earlier step left in dist/.
            - run: pnpm build

            - name: Publish with trusted publishing (OIDC, provenance attached by npm)
              run: npm publish --access public --tag "$DIST_TAG"
