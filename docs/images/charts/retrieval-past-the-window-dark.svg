<svg xmlns="http://www.w3.org/2000/svg" width="800" height="517" viewBox="0 0 800 517" role="img" aria-labelledby="retrieval-past-the-window-title retrieval-past-the-window-description" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif"><title id="retrieval-past-the-window-title">Text past the embedder window is hard to find</title>
<desc id="retrieval-past-the-window-description">Mastra's defaults: @mastra/rag chunks to 4,000 characters and @mastra/fastembed embeds the first 512 tokens of each input. Share of queries that find their source, with Wilson 95% intervals. A long book: source chunk in the top 5. Sentence from a chunk's head: Query text inside the embedder window 83/120, 69.2% (95% CI 60.4% to 76.7%). Sentence from a chunk's tail: Query text past the window (never embedded) 37/120, 30.8% (95% CI 23.3% to 39.6%). Same tail sentence, chunks of 1,500 characters: Query text inside the embedder window 100/120, 83.3% (95% CI 75.6% to 88.9%). Mastra Memory semantic recall: message in the top 3. Sentence in the first 512 tokens: Query text inside the embedder window 32/39, 82.1% (95% CI 67.3% to 91.0%). Sentence after token 512: Query text past the window (never embedded) 14/38, 36.8% (95% CI 23.4% to 52.7%). Scripted (offline, no model). Sources: results/repros/fastembed-truncation.json (darwin 25.6.0 arm64, Node v24.22.0, generated 2026-10-15) and results/repros/memory-fastembed-truncation.json (darwin 25.6.0 arm64, Node v24.22.0, generated 2026-10-15).</desc>
